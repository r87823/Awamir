name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://awamir:awamir@localhost:5432/awamir_test
      REDIS_URL: redis://localhost:6379
      ERPNEXT_WORKER_ENABLED: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: awamir
          POSTGRES_PASSWORD: awamir
          POSTGRES_DB: awamir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awamir -d awamir_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Run Prisma migrations
        run: pnpm prisma:migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Backend tests
        run: pnpm test

      - name: Backend e2e tests
        run: pnpm test:e2e

      - name: Flutter analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Flutter tests
        working-directory: apps/mobile
        run: flutter test