name: Docker Images

on:
  workflow_dispatch:
  push:
    branches: [develop]
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/awamir-plus-api
  WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/awamir-plus-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          {
            echo "short_sha=${short_sha}"
            echo "api_tags<<EOF"
            echo "${API_IMAGE}:sha-${short_sha}"
            if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
              echo "${API_IMAGE}:staging"
            fi
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "${API_IMAGE}:${GITHUB_REF_NAME}"
            fi
            echo "EOF"
            echo "worker_tags<<EOF"
            echo "${WORKER_IMAGE}:sha-${short_sha}"
            if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
              echo "${WORKER_IMAGE}:staging"
            fi
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "${WORKER_IMAGE}:${GITHUB_REF_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          push: true
          tags: ${{ steps.meta.outputs.api_tags }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: worker
          push: true
          tags: ${{ steps.meta.outputs.worker_tags }}
